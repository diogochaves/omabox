<!-- omabox up's polkit option (#258, NOTES finding 627): the box's own system bus, a dbus-daemon
     in the box at $XDG_RUNTIME_DIR/omabox-polkit/bus (share/session.sh gives the address), never the
     host's. Its one service is omabox-polkit, the stand-in authority; nothing is activated on it, and
     everything on it is the box user's, so it allows all. (No double hyphen: XML comments refuse one.) -->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <type>system</type>
  <keep_umask/>
  <!-- dbus-daemon wants one; the address session.sh passes takes its place. -->
  <listen>unix:tmpdir=/tmp</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
