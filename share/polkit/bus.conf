<!-- omabox up's polkit option (#258, NOTES finding 627): the box's own system bus, a dbus-daemon
     in the box at $XDG_RUNTIME_DIR/omabox-polkit/bus (share/session.sh gives the address), never the
     host's. Nothing is activated on it, and no name on it can be owned but polkit's own,
     org.freedesktop.PolicyKit1, which omabox-polkit (the stand-in authority) takes first and lets
     nobody replace. That is all a bus policy can hold here: every process in the box has one uid,
     so one that ends the stand-in takes its name. What the host says of an answer from this bus
     (omabox polkit ask, agents) is the box's, said plain and bounded (S7).
     (No double hyphen: XML comments refuse one.) -->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <type>system</type>
  <keep_umask/>
  <!-- dbus-daemon wants one; the address session.sh passes takes its place. -->
  <listen>unix:tmpdir=/tmp</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="org.freedesktop.PolicyKit1"/>
  </policy>
</busconfig>
