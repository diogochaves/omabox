[package]
name = "omabox"
version = "0.0.0"
description = "A contained, invisible Hyprland desktop for agents, Omarchy's or plain"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "omabox"
path = "src/main.rs"

[dependencies]
libc = "0.2.191"
serde_json = { version = "1.0.154", features = ["preserve_order", "arbitrary_precision"] }

[dev-dependencies]
proptest = { version = "1.12", default-features = false, features = ["std"] }
